name: Feature Request
description: 提出一个功能或产品改进
title: "[Feature] "
labels:
  - feature
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 先说明问题，不要只写方案
      placeholder: 当前导出路径只能手填，桌面客户端里不够自然
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明你想要的交互或实现方向
      placeholder: 在 Electron 客户端里改成系统文件夹选择器
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 范围与优先级
      description: 说明这是必须项还是增强项，有没有阶段性方案
      placeholder: 第一版只做 mac / Windows 共用的基础文件夹选择能力

  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 这个功能完成后，怎样算可用
      placeholder: 用户点击导出时可以直接选择本地文件夹，选择后导出成功
