name: CI

on:
  push:
    branches:
      - main
      - 'codex/**'
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

jobs:
  frontend-and-backend-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop-app/gymclip-reviewer/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install frontend dependencies
        working-directory: desktop-app/gymclip-reviewer
        run: npm ci

      - name: Frontend type check
        working-directory: desktop-app/gymclip-reviewer
        run: npm run lint

      - name: Frontend build
        working-directory: desktop-app/gymclip-reviewer
        run: npm run build

      - name: Backend syntax check
        run: |
          python -m py_compile \
            desktop-app/backend/main.py \
            desktop-app/backend/video_review_backend/*.py \
            desktop-app/backend/scripts/*.py

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install ffmpeg
        # test_local_cards.py exercises export-service code paths that
        # resolve ffmpeg via media_binaries._find_ffmpeg(). Ubuntu runners
        # don't ship ffmpeg by default; install it so the tests can mock
        # higher-level behavior without the path resolver throwing.
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install backend deps
        working-directory: desktop-app/backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run pytest
        working-directory: desktop-app/backend
        # Gate is intentionally below the 50% goal because routers/* and
        # platform_client are still uncovered (D-frontend will land e2e).
        # Bump to 50 once those land. See planning/D-coverage-followup.md.
        run: python -m pytest tests/ --cov=video_review_backend --cov-report=term --cov-fail-under=45

  e2e-mac:
    # End-to-end Electron tests via Playwright. macOS-only because the
    # desktop app's primary distribution target is macOS and the test
    # exercises the real Electron + native dialogs path.
    runs-on: macos-latest
    if: github.event_name == 'pull_request'
    env:
      # Point electron's install.js at a stable, cacheable directory so the
      # postinstall download survives across runs. Without this the binary is
      # re-downloaded from GitHub releases on every cold npm cache, and that
      # download is flaky -> Playwright's electron.launch then fails with
      # "Electron failed to install correctly". See the verify-and-retry step.
      ELECTRON_CACHE: ~/Library/Caches/electron
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop-app/gymclip-reviewer/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Cache the Electron binary download (and Playwright browsers) keyed on
      # the lockfile. The npm cache restores node_modules metadata but NOT the
      # out-of-tree binary in ~/Library/Caches/electron, which is what the
      # postinstall step fetches. Caching it removes the flaky network hop on
      # cold runs; install.js reuses the cached zip via ELECTRON_CACHE.
      - name: Cache Electron & Playwright binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/ms-playwright
          key: ${{ runner.os }}-e2e-binaries-${{ hashFiles('desktop-app/gymclip-reviewer/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-e2e-binaries-

      - name: Install backend dependencies
        working-directory: desktop-app/backend
        run: pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: desktop-app/gymclip-reviewer
        run: npm ci

      - name: Verify Electron binary (retry on cold-cache flake)
        working-directory: desktop-app/gymclip-reviewer
        # npm ci's postinstall downloads the Electron binary; on a cold npm
        # cache that download is flaky and can leave node_modules/electron
        # without a binary, which makes Playwright's electron.launch fail
        # before any assertion runs. Verify the binary resolves AND its dist
        # exists; if not, reinstall it (install.js, then npm rebuild) with
        # backoff, up to 3 attempts. Only fail the step if all attempts fail.
        run: |
          set -u
          ELECTRON_CACHE=~/Library/Caches/electron
          export ELECTRON_CACHE

          verify() {
            # require('electron') must resolve to a path AND dist/ must exist
            node -e "const p=require('electron'); if (typeof p!=='string'||!p) process.exit(1)" \
              && [ -d node_modules/electron/dist ]
          }

          if verify; then
            echo "Electron binary present on first check."
            exit 0
          fi

          for attempt in 1 2 3; do
            echo "Electron binary missing/invalid; reinstall attempt ${attempt}/3..."
            if [ -f node_modules/electron/install.js ]; then
              node node_modules/electron/install.js || true
            fi
            if verify; then
              echo "Electron binary ready after install.js (attempt ${attempt})."
              exit 0
            fi
            npm rebuild electron || true
            if verify; then
              echo "Electron binary ready after npm rebuild (attempt ${attempt})."
              exit 0
            fi
            sleep $((attempt * 10))
          done

          echo "ERROR: Electron binary could not be installed after 3 attempts." >&2
          exit 1

      - name: Install Playwright browsers
        working-directory: desktop-app/gymclip-reviewer
        run: npx playwright install chromium

      - name: Install ffmpeg
        run: brew install ffmpeg

      - name: Generate fixture videos
        working-directory: desktop-app/gymclip-reviewer/e2e/fixtures
        run: bash generate.sh

      - name: Build frontend
        working-directory: desktop-app/gymclip-reviewer
        run: npm run build

      - name: Run Playwright e2e tests
        working-directory: desktop-app/gymclip-reviewer
        run: npx playwright test --reporter=line

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            desktop-app/gymclip-reviewer/playwright-report/
            desktop-app/gymclip-reviewer/test-results/
          retention-days: 7
