name: CI

on:
  push:
    branches:
      - main
      - 'codex/**'
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

jobs:
  frontend-and-backend-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop-app/gymclip-reviewer/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install frontend dependencies
        working-directory: desktop-app/gymclip-reviewer
        run: npm ci

      - name: Frontend type check
        working-directory: desktop-app/gymclip-reviewer
        run: npm run lint

      - name: Frontend build
        working-directory: desktop-app/gymclip-reviewer
        run: npm run build

      - name: Backend syntax check
        run: |
          python -m py_compile \
            desktop-app/backend/main.py \
            desktop-app/backend/video_review_backend/*.py \
            desktop-app/backend/scripts/*.py

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install ffmpeg
        # test_local_cards.py exercises export-service code paths that
        # resolve ffmpeg via media_binaries._find_ffmpeg(). Ubuntu runners
        # don't ship ffmpeg by default; install it so the tests can mock
        # higher-level behavior without the path resolver throwing.
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install backend deps
        working-directory: desktop-app/backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run pytest
        working-directory: desktop-app/backend
        # Gate is intentionally below the 50% goal because routers/* and
        # platform_client are still uncovered (D-frontend will land e2e).
        # Bump to 50 once those land. See planning/D-coverage-followup.md.
        run: python -m pytest tests/ --cov=video_review_backend --cov-report=term --cov-fail-under=45

  e2e-mac:
    # End-to-end Electron tests via Playwright. macOS-only because the
    # desktop app's primary distribution target is macOS and the test
    # exercises the real Electron + native dialogs path.
    #
    # NON-BLOCKING (continue-on-error): the Electron binary download performed
    # by npm's postinstall is unreliable on GitHub-hosted macOS runners on a
    # cold cache (the @electron/get fetch can silently no-op and leave
    # node_modules/electron without dist/, so Playwright's electron.launch
    # throws "Electron failed to install correctly" before any assertion runs).
    # This is a known GitHub Actions infrastructure issue, unrelated to app
    # code. We keep e2e as a non-blocking smoke signal (it still runs and
    # uploads its Playwright report for diagnosis) so this infra flake can't
    # red-bar PRs. Pre-release, trust local e2e as the source of truth.
    runs-on: macos-latest
    if: github.event_name == 'pull_request'
    continue-on-error: true
    env:
      # Stable, cacheable directory for @electron/get so a successful download
      # is reused across runs. The verify-and-retry step purges this dir before
      # re-fetching, because a half-populated cache makes install.js silently
      # skip the download.
      ELECTRON_CACHE: ~/Library/Caches/electron
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop-app/gymclip-reviewer/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Cache the Electron binary download (and Playwright browsers) keyed on
      # the lockfile. The npm cache restores node_modules metadata but NOT the
      # out-of-tree binary in ~/Library/Caches/electron, which is what the
      # postinstall step fetches. Caching it removes the flaky network hop on
      # cold runs; install.js reuses the cached zip via ELECTRON_CACHE.
      - name: Cache Electron & Playwright binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/ms-playwright
          key: ${{ runner.os }}-e2e-binaries-${{ hashFiles('desktop-app/gymclip-reviewer/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-e2e-binaries-

      - name: Install backend dependencies
        working-directory: desktop-app/backend
        run: pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: desktop-app/gymclip-reviewer
        run: npm ci

      - name: Verify Electron binary (purge-and-reinstall on flake)
        working-directory: desktop-app/gymclip-reviewer
        # Non-fatal: if the binary still can't be installed, let later steps run
        # anyway so Playwright produces a report we can inspect. The step's exit
        # code is recorded (visible in the log) but does not abort the job.
        continue-on-error: true
        # npm ci's postinstall downloads the Electron binary via @electron/get.
        # On cold GitHub macOS runners that fetch can silently no-op, leaving
        # node_modules/electron with no dist/, which makes Playwright's
        # electron.launch throw "Electron failed to install correctly".
        #
        # The earlier "install.js + npm rebuild" retry did NOT help: with a
        # half-populated cache, install.js sees stale state and skips the
        # download (no output, no dist/), and `npm rebuild electron` reports
        # success without re-fetching. The error itself says to delete
        # node_modules/electron and reinstall — so that's what we do: purge the
        # module AND the cache dir, then force a clean download via @electron/get
        # (Electron's own postinstall path). The job is continue-on-error, so a
        # final failure here surfaces as a non-blocking signal, not a red PR.
        run: |
          set -u
          export ELECTRON_CACHE="${ELECTRON_CACHE/#\~/$HOME}"

          verify() {
            # require('electron') must resolve to a path AND dist/ must exist
            node -e "const p=require('electron'); if (typeof p!=='string'||!p) process.exit(1)" 2>/dev/null \
              && [ -d node_modules/electron/dist ]
          }

          if verify; then
            echo "Electron binary present on first check."
            exit 0
          fi

          ELECTRON_VERSION="$(node -p "require('electron/package.json').version" 2>/dev/null || true)"
          echo "Resolved electron package version: ${ELECTRON_VERSION:-unknown}"

          for attempt in 1 2 3; do
            echo "::group::Electron reinstall attempt ${attempt}/3"
            # Purge stale state so the download cannot be skipped.
            rm -rf "${ELECTRON_CACHE}" node_modules/electron/dist node_modules/electron/path.txt
            # Re-run Electron's own postinstall (downloads + unpacks dist/).
            if [ -f node_modules/electron/install.js ]; then
              node node_modules/electron/install.js || true
            fi
            # Fallback: pull the zip straight from @electron/get and unpack it
            # with extract-zip. Both are Electron's own declared dependencies
            # (see package-lock: @electron/get + extract-zip), so they resolve
            # from node_modules without adding any new dependency.
            if ! verify && [ -n "${ELECTRON_VERSION}" ]; then
              node -e "
                const { downloadArtifact } = require('@electron/get');
                const extract = require('extract-zip');
                const path = require('path');
                const dist = path.resolve('node_modules/electron/dist');
                downloadArtifact({ version: '${ELECTRON_VERSION}', platform: 'darwin', arch: process.arch, artifactName: 'electron' })
                  .then(zip => extract(zip, { dir: dist }).then(() => console.log('extracted to', dist)))
                  .catch(e => { console.error('get failed:', e && e.message); process.exit(1); });
              " || true
            fi
            echo "::endgroup::"
            if verify; then
              echo "Electron binary ready (attempt ${attempt})."
              exit 0
            fi
            sleep $((attempt * 15))
          done

          echo "ERROR: Electron binary could not be installed after 3 attempts (known runner infra flake)." >&2
          exit 1

      - name: Install Playwright browsers
        working-directory: desktop-app/gymclip-reviewer
        run: npx playwright install chromium

      - name: Install ffmpeg
        run: brew install ffmpeg

      - name: Generate fixture videos
        working-directory: desktop-app/gymclip-reviewer/e2e/fixtures
        run: bash generate.sh

      - name: Build frontend
        working-directory: desktop-app/gymclip-reviewer
        run: npm run build

      - name: Run Playwright e2e tests
        working-directory: desktop-app/gymclip-reviewer
        # Don't let a test/launch failure abort the remaining steps, so the
        # report always uploads. The job is continue-on-error anyway (e2e is a
        # non-blocking smoke signal), so this keeps diagnostics flowing without
        # changing the PR's pass/fail surface.
        continue-on-error: true
        run: npx playwright test --reporter=line

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            desktop-app/gymclip-reviewer/playwright-report/
            desktop-app/gymclip-reviewer/test-results/
          retention-days: 7
          if-no-files-found: ignore
