name: CI

on:
  push:
    branches:
      - main
      - 'codex/**'
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

jobs:
  frontend-and-backend-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop-app/gymclip-reviewer/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install frontend dependencies
        working-directory: desktop-app/gymclip-reviewer
        run: npm ci

      - name: Frontend type check
        working-directory: desktop-app/gymclip-reviewer
        run: npm run lint

      - name: Frontend build
        working-directory: desktop-app/gymclip-reviewer
        run: npm run build

      - name: Backend syntax check
        run: |
          python -m py_compile \
            desktop-app/backend/main.py \
            desktop-app/backend/video_review_backend/*.py \
            desktop-app/backend/scripts/*.py

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install backend deps
        working-directory: desktop-app/backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run pytest
        working-directory: desktop-app/backend
        # Gate is intentionally below the 50% goal because routers/* and
        # platform_client are still uncovered (D-frontend will land e2e).
        # Bump to 50 once those land. See planning/D-coverage-followup.md.
        run: python -m pytest tests/ --cov=video_review_backend --cov-report=term --cov-fail-under=45
