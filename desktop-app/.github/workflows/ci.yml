name: CI

on:
  push:
    branches:
      - main
      - 'codex/**'
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

jobs:
  frontend-and-backend-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gymclip-reviewer/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install frontend dependencies
        working-directory: gymclip-reviewer
        run: npm ci

      - name: Frontend type check
        working-directory: gymclip-reviewer
        run: npm run lint

      - name: Frontend build
        working-directory: gymclip-reviewer
        run: npm run build

      - name: Backend syntax check
        run: |
          python -m py_compile \
            backend/main.py \
            backend/video_review_backend/*.py \
            backend/scripts/*.py
